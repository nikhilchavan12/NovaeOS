set timeout=5
set default=0

insmod all_video
insmod gfxterm

menuentry "NovaeOS 1.0.0 (Desktop)" {
    set gfxpayload=1024x768x32,1024x768
    multiboot /boot/kernel.bin
    boot
}

menuentry "NovaeOS 1.0.0 (Text mode shell)" {
    set gfxpayload=text
    multiboot /boot/kernel.bin text
    boot
}

menuentry "NovaeOS (Text mode, debug)" {
    set gfxpayload=text
    multiboot /boot/kernel.bin text debug
    boot
}
